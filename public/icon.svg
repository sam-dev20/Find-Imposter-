<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F4F5" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#27272A" stroke-width="8" />
  
  <!-- Inner White Shield / Container -->
  <circle cx="230" cy="230" r="140" fill="url(#lensGrad)" />
  <circle cx="230" cy="230" r="140" fill="none" stroke="#09090B" stroke-width="32" />
  
  <!-- Central Pupil / Mystery Iris -->
  <circle cx="230" cy="230" r="38" fill="#09090B" />
  <circle cx="218" cy="218" r="12" fill="#FFFFFF" opacity="0.9" />
  
  <!-- Specular Lens Highlights -->
  <path d="M 150 160 A 100 100 0 0 1 290 150" fill="none" stroke="#E4E4E7" stroke-width="14" stroke-linecap="round" />
  
  <!-- Handle -->
  <path d="M 335 335 L 430 430" stroke="#09090B" stroke-width="44" stroke-linecap="round" />
  <path d="M 345 345 L 420 420" stroke="#EF4444" stroke-width="16" stroke-linecap="round" />
</svg>
